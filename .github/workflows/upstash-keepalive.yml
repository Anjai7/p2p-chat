name: Upstash Keepalive

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping Redis
        run: |
          node - <<'EOF'
          const url = (
            process.env.KV_REST_API_URL ||
            process.env.UPSTASH_REDIS_REST_URL ||
            ""
          ).replace(/\/$/, "");
          const token =
            process.env.KV_REST_API_TOKEN ||
            process.env.UPSTASH_REDIS_REST_TOKEN ||
            "";

          async function main() {
            if (!url || !token) {
              console.warn("Keepalive skipped: missing KV/Upstash REST credentials.");
              return;
            }

            try {
              const authHeader = "Bearer " + token;
              const response = await fetch(`${url}/ping`, {
                method: "POST",
                headers: {
                  Authorization: authHeader,
                },
              });

              if (!response.ok) {
                throw new Error(`Ping failed with HTTP ${response.status}`);
              }

              console.log("Redis is alive:", new Date().toISOString());
            } catch (err) {
              const code = err?.cause?.code;
              if (code === "ENOTFOUND" || code === "EAI_AGAIN") {
                console.warn(`Keepalive skipped due to DNS/network issue: ${code}`);
                return;
              }
              throw err;
            }
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
